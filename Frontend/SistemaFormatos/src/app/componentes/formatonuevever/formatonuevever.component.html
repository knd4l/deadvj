<main class="container-fluid px-4">
  <div class="card shadow border-0 my-4">
    <div class="card-header bg-institucional d-flex align-items-center justify-content-between">
      <h4 class="mb-0"><b>FORMATOS 9 GUARDADOS</b></h4>
      <button class="btn btn-institucional btn-sm" type="button" (click)="cargarFormatos()" [disabled]="cargando">
        {{ cargando ? 'Cargando...' : 'Actualizar' }}
      </button>
    </div>
    <div class="card-body">
      <div *ngIf="cargando && formatos.length === 0" class="py-4 text-center">Cargando registros...</div>
      <div *ngIf="!cargando && formatos.length === 0" class="py-4 text-center text-muted">
        No hay formularios guardados.
      </div>

      <div *ngIf="formatos.length > 0" class="table-responsive">
        <table class="table table-bordered table-hover text-center align-middle">
          <thead>
            <tr>
              <th>Código del curso definido</th>
              <th>Nombre del curso definido</th>
              <th>Nombre del módulo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let formato of formatos; trackBy: trackByFormato">
              <td>{{ formato.formato1_codigo_curso || '—' }}</td>
              <td>{{ formato.formato1_curso_definido || '—' }}</td>
              <td>{{ formato.formato9_modulo_nombre || '—' }}</td>
              <td>
                <button
                  class="btn btn-institucional btn-sm"
                  type="button"
                  (click)="verReporte(formato)"
                  [disabled]="generandoReporte"
                  [attr.aria-label]="'Ver reporte PDF del curso ' + (formato.formato1_codigo_curso || '')"
                  title="Ver reporte PDF">
                  <i class="fa fa-file-pdf" aria-hidden="true"></i> PDF
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
