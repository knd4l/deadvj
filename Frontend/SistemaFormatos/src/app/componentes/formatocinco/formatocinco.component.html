<main class="container-fluid px-4">
  <div class="card shadow border-0 my-4">
    <div class="card-header bg-institucional text-center">
      <h4 class="mb-0"><b>{{ editando ? 'EDITAR ENTREVISTA - FORMATO 5' : 'FORMATO 5' }}</b></h4>
    </div>
    <div class="card-body">
      <form #formulario="ngForm" (ngSubmit)="guardar(formulario)" novalidate>
        <div class="table-responsive mb-4">
          <table class="table table-bordered align-middle course-table mb-0">
            <tbody>
              <tr>
                <th scope="row">Curso definido</th>
                <td>
                  <select class="form-select" id="cursoFormato5" name="formato6Codigo" [(ngModel)]="formato6Codigo" (ngModelChange)="formato6ModuloId = null" [disabled]="editando" required>
                    <option [ngValue]="null">Seleccionar curso</option>
                    <option *ngFor="let curso of cursos" [ngValue]="curso.formato6_codigo">
                      {{ curso.formato1_codigo_curso || 'Sin código' }} - {{ curso.formato1_curso_definido }}
                    </option>
                  </select>
                </td>
              </tr>
              <tr>
                <th scope="row">Módulo</th>
                <td>
                  <select class="form-select" id="moduloFormato5" name="formato6ModuloId" [(ngModel)]="formato6ModuloId" required>
                    <option [ngValue]="null">Seleccionar módulo</option>
                    <option *ngFor="let modulo of modulosDisponibles" [ngValue]="modulo.id">
                      {{ modulo.nombre }}
                    </option>
                  </select>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="participant-list">
          <section *ngFor="let participante of participantes; let i = index" class="participant-entry">
            <div class="participant-heading">
              <h5 class="mb-0">Evaluación {{ i + 1 }}</h5>
            <button *ngIf="!editando && participantes.length > 1" class="btn btn-outline-danger btn-sm" type="button" (click)="quitarParticipante(i)" [attr.aria-label]="'Quitar evaluación ' + (i + 1)" title="Quitar evaluación">
                <i class="fa fa-trash" aria-hidden="true"></i>
              </button>
            </div>
            <datalist [id]="'usuariosCedulasFormato5' + i">
              <option *ngFor="let usuario of usuariosDisponiblesPara(participante)" [value]="usuario.cedula">
                {{ usuario.nombres }} {{ usuario.apellidos }}
              </option>
            </datalist>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label fw-bold" [for]="'cedulaFormato5' + i">Número de cédula</label>
                <input class="form-control" type="search" [id]="'cedulaFormato5' + i" [name]="'cedula' + i" [(ngModel)]="participante.cedula" (change)="seleccionarUsuario(participante)" [attr.list]="'usuariosCedulasFormato5' + i" autocomplete="off" inputmode="numeric" maxlength="52" placeholder="Buscar por cédula" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold" [for]="'nombresFormato5' + i">Nombres</label>
                <input class="form-control" type="text" [id]="'nombresFormato5' + i" [name]="'nombres' + i" [(ngModel)]="participante.nombres" readonly required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold" [for]="'apellidosFormato5' + i">Apellidos</label>
                <input class="form-control" type="text" [id]="'apellidosFormato5' + i" [name]="'apellidos' + i" [(ngModel)]="participante.apellidos" readonly required>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold" [for]="'dominioTematica' + i">Dominio de temática</label>
                <input class="form-control" type="number" [id]="'dominioTematica' + i" [name]="'dominioTematica' + i" [(ngModel)]="participante.dominioTematica" (ngModelChange)="actualizarNotaEntrevista(participante)" step="any" required>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold" [for]="'dominioAula' + i">Dominio de aula</label>
                <input class="form-control" type="number" [id]="'dominioAula' + i" [name]="'dominioAula' + i" [(ngModel)]="participante.dominioAula" (ngModelChange)="actualizarNotaEntrevista(participante)" step="any" required>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold" [for]="'habilidadesBlandas' + i">Habilidades blandas</label>
                <input class="form-control" type="number" [id]="'habilidadesBlandas' + i" [name]="'habilidadesBlandas' + i" [(ngModel)]="participante.habilidadesBlandas" (ngModelChange)="actualizarNotaEntrevista(participante)" step="any" required>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold" [for]="'notaEntrevista' + i">Nota de entrevista</label>
                <input class="form-control" type="number" [id]="'notaEntrevista' + i" [name]="'notaEntrevista' + i" [(ngModel)]="participante.notaEntrevista" readonly required>
              </div>
              <div class="col-12">
                <label class="form-label fw-bold" [for]="'observacionesFormato5' + i">Observaciones</label>
                <input class="form-control" type="text" [id]="'observacionesFormato5' + i" [name]="'observaciones' + i" [(ngModel)]="participante.observaciones">
              </div>
            </div>
          </section>
        </div>

        <div class="d-flex flex-wrap justify-content-between gap-2 mt-3">
          <button *ngIf="!editando" class="btn btn-institucional" type="button" (click)="agregarParticipante()">
            <i class="fa fa-plus" aria-hidden="true"></i> Agregar otro
          </button>
          <button class="btn btn-institucional" type="submit" [disabled]="guardando">
            {{ guardando ? (editando ? 'Actualizando...' : 'Guardando...') : (editando ? 'Actualizar entrevista' : 'Guardar Formato 5') }}
          </button>
        </div>
      </form>
    </div>
  </div>
</main>
